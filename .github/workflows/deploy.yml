name: Build and Deploy

on:
  push:
    branches:
      - main
      - feat/ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKERHUB_USER != '' && 'docker.io' || 'ghcr.io' }}
          username: ${{ secrets.DOCKERHUB_USER != '' && secrets.DOCKERHUB_USER || github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER != '' && format('{0}/app:{1}', secrets.DOCKERHUB_USER, github.sha) || format('ghcr.io/{0}/app:{1}', github.actor, github.sha) }}
            ${{ secrets.DOCKERHUB_USER != '' && format('{0}/app:latest', secrets.DOCKERHUB_USER) || format('ghcr.io/{0}/app:latest', github.actor) }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKERHUB_USER != '' && 'docker.io' || 'ghcr.io' }}
          username: ${{ secrets.DOCKERHUB_USER != '' && secrets.DOCKERHUB_USER || github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Deploy with Docker Compose
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USER != '' && format('{0}/app:{1}', secrets.DOCKERHUB_USER, github.sha) || format('ghcr.io/{0}/app:{1}', github.actor, github.sha) }}
        run: |
          docker compose pull
          docker compose up -d
          sleep 5
          curl -f http://localhost:8080/health


