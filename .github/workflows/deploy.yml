name: Build and Deploy

on:
  push:
    branches:
      - main
      - feat/ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare registry credentials and tags
        id: prep
        run: |
          USER_NAME="${{ secrets.DOCKERHUB_USER }}"
          if [ -n "$USER_NAME" ]; then
            REGISTRY="docker.io"
            OWNER=$(echo "$USER_NAME" | tr '[:upper:]' '[:lower:]')
            PASS="${{ secrets.DOCKERHUB_TOKEN }}"
          else
            REGISTRY="ghcr.io"
            OWNER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
            PASS="${{ secrets.GITHUB_TOKEN }}"
          fi
          IMAGE_TAG="$REGISTRY/$OWNER/app:${{ github.sha }}"
          IMAGE_LATEST="$REGISTRY/$OWNER/app:latest"
          
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_latest=$IMAGE_LATEST" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.prep.outputs.registry }}
          username: ${{ steps.prep.outputs.owner }}
          password: ${{ steps.prep.outputs.pass }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prep.outputs.image_tag }}
            ${{ steps.prep.outputs.image_latest }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare registry credentials and tags
        id: prep
        run: |
          USER_NAME="${{ secrets.DOCKERHUB_USER }}"
          if [ -n "$USER_NAME" ]; then
            REGISTRY="docker.io"
            OWNER=$(echo "$USER_NAME" | tr '[:upper:]' '[:lower:]')
            PASS="${{ secrets.DOCKERHUB_TOKEN }}"
          else
            REGISTRY="ghcr.io"
            OWNER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
            PASS="${{ secrets.GITHUB_TOKEN }}"
          fi
          IMAGE_TAG="$REGISTRY/$OWNER/app:${{ github.sha }}"
          
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.prep.outputs.registry }}
          username: ${{ steps.prep.outputs.owner }}
          password: ${{ steps.prep.outputs.pass }}

      - name: Deploy with Docker Compose
        env:
          IMAGE: ${{ steps.prep.outputs.image_tag }}
        run: |
          docker compose pull
          docker compose up -d
          sleep 5
          curl -f http://localhost:8080/health



